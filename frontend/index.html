<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGG · Banco Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#081625; --bg-1:#0E2237; --bg-2:#14304C;
    --line:#1E3E5C; --line-strong:#2C567D;
    --text-0:#EDF3F8; --text-1:#9FB4C7; --text-2:#5F7A93;
    --accent:#2FD9C4; --accent-dim:#164A44;
    --amber:#F5A623; --amber-dim:#4A3512;
    --red:#E85D5D; --red-dim:#4A1E1E;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg-0); color:var(--text-0);
    font-family:var(--font-body); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:32px 16px;
  }
  .shell{
    width:100%; max-width:920px;
    display:grid; grid-template-columns:280px 1fr;
    background:var(--bg-1); border:1px solid var(--line); border-radius:14px;
    overflow:hidden;
  }
  @media (max-width:720px){ .shell{ grid-template-columns:1fr; } }

  /* ── Panel lateral: identidad + pulso en vivo ───────────────────── */
  .side{
    background:var(--bg-0); padding:28px 24px; border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:28px;
  }
  @media (max-width:720px){ .side{ border-right:none; border-bottom:1px solid var(--line); } }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:34px; height:34px; border-radius:8px; background:var(--accent-dim);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{ width:18px; height:18px; }
  .brand-name{ font-family:var(--font-display); font-weight:600; font-size:15px; line-height:1.2; }
  .brand-sub{ font-size:11px; color:var(--text-2); letter-spacing:.04em; }

  .pulse-box{
    background:var(--bg-2); border:1px solid var(--line); border-radius:10px; padding:16px;
  }
  .pulse-label{ font-size:11px; color:var(--text-1); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
  .pulse-svg{ width:100%; height:44px; display:block; }
  .pulse-path{ fill:none; stroke:var(--accent); stroke-width:1.6; }
  .pulse-time{
    font-family:var(--font-mono); font-size:26px; font-weight:500; color:var(--accent);
    margin-top:8px; letter-spacing:-0.01em;
  }
  .pulse-hint{ font-size:11px; color:var(--text-2); margin-top:4px; }

  .config-box{ margin-top:auto; }
  .config-label{ font-size:11px; color:var(--text-1); margin-bottom:6px; display:block; }
  .config-box input{
    width:100%; background:var(--bg-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text-0); font-family:var(--font-mono); font-size:12px; padding:9px 10px;
  }
  .config-box input:focus{ outline:none; border-color:var(--accent); }
  .config-status{ font-size:11px; margin-top:6px; display:flex; align-items:center; gap:6px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--text-2); }
  .dot.ok{ background:var(--accent); }
  .dot.bad{ background:var(--red); }

  /* ── Panel principal ─────────────────────────────────────────────── */
  .main{ padding:32px 32px 28px; display:flex; flex-direction:column; }
  .step-eyebrow{ font-size:11px; color:var(--text-2); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
  .step-title{ font-family:var(--font-display); font-weight:600; font-size:20px; margin:0 0 22px; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; color:var(--text-1); margin-bottom:6px; }
  .field input, .field select{
    width:100%; background:var(--bg-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text-0); font-family:var(--font-body); font-size:14px; padding:11px 12px;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--accent); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .btn{
    width:100%; background:var(--accent); color:#052824; border:none; border-radius:8px;
    font-family:var(--font-body); font-weight:600; font-size:14px; padding:13px;
    cursor:pointer; margin-top:6px; transition:opacity .15s;
  }
  .btn:hover{ opacity:.88; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-ghost{
    width:100%; background:transparent; color:var(--text-1); border:1px solid var(--line);
    border-radius:8px; font-size:13px; padding:10px; cursor:pointer; margin-top:10px;
  }
  .btn-ghost:hover{ border-color:var(--line-strong); color:var(--text-0); }

  .result{
    margin-top:18px; border-radius:8px; padding:13px 14px; font-size:13px;
    display:none; border:1px solid;
  }
  .result.show{ display:block; }
  .result.ok{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .result.err{ background:var(--red-dim); border-color:var(--red); color:var(--red); }

  .account-card{
    background:var(--bg-2); border:1px solid var(--line); border-radius:10px; padding:16px;
    margin-bottom:22px; display:flex; justify-content:space-between; align-items:center;
  }
  .account-card .name{ font-weight:600; font-size:14px; }
  .account-card .id{ font-family:var(--font-mono); font-size:11px; color:var(--text-2); margin-top:2px; }
  .badge{
    font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:4px 9px;
    border-radius:20px; background:var(--accent-dim); color:var(--accent); font-weight:600;
  }

  .log-feed{
    margin-top:22px; border-top:1px solid var(--line); padding-top:14px;
  }
  .log-feed-label{ font-size:11px; color:var(--text-2); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .log-entry{
    font-family:var(--font-mono); font-size:11.5px; color:var(--text-1);
    padding:5px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px;
  }
  .log-entry:last-child{ border-bottom:none; }
  .log-entry .tag{ color:var(--accent); flex-shrink:0; }
  .log-entry .fail{ color:var(--red); }

  .activity-refresh{
    background:none; border:none; color:var(--text-2); font-size:11px; cursor:pointer;
    text-decoration:underline; padding:0;
  }
  .activity-refresh:hover{ color:var(--accent); }
  .activity-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:7px 0; border-bottom:1px solid var(--line); font-size:12px;
  }
  .activity-row:last-child{ border-bottom:none; }
  .activity-left{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .activity-detail{ color:var(--text-0); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .activity-time{ color:var(--text-2); font-size:10.5px; font-family:var(--font-mono); }
  .source-pill{
    font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
    padding:3px 8px; border-radius:20px; flex-shrink:0;
  }
  .source-pill.human{ background:var(--accent-dim); color:var(--accent); }
  .source-pill.simulated{ background:var(--amber-dim); color:var(--amber); }
  .source-pill.unknown{ background:var(--bg-2); color:var(--text-2); }
  .activity-empty{ font-size:12px; color:var(--text-2); padding:8px 0; }
</style>
</head>
<body>

<div class="shell">

  <!-- ── SIDEBAR ─────────────────────────────────────────────────── -->
  <div class="side">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2FD9C4" stroke-width="1.8">
          <path d="M12 2 3 6v6c0 5 4 8.5 9 10 5-1.5 9-5 9-10V6z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Biometric Ghost Gate</div>
        <div class="brand-sub">Banco Sandbox · AQ Tech</div>
      </div>
    </div>

    <div class="pulse-box">
      <div class="pulse-label">Tiempo de llenado</div>
      <svg class="pulse-svg" viewBox="0 0 220 44" preserveAspectRatio="none">
        <path id="pulsePath" class="pulse-path" d="M0,22 L220,22"/>
      </svg>
      <div class="pulse-time" id="timerDisplay">0.00s</div>
      <div class="pulse-hint" id="timerHint">Esperando interacción…</div>
    </div>

    <div class="config-box">
      <label class="config-label" for="apiBase">URL del backend (VM)</label>
      <input type="text" id="apiBase" value="http://localhost:8000" spellcheck="false">
      <div class="config-status"><span class="dot" id="apiDot"></span><span id="apiStatusText">Sin verificar</span></div>
    </div>
  </div>

  <!-- ── MAIN ────────────────────────────────────────────────────── -->
  <div class="main">

    <!-- PASO 1: LOGIN -->
    <div id="viewLogin">
      <div class="step-eyebrow">Paso 1 de 2</div>
      <h1 class="step-title">Iniciar sesión</h1>

      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="cliente_001" autocomplete="off">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••••">
      </div>
      <button class="btn" id="btnLogin">Iniciar sesión</button>
      <div class="result" id="loginResult"></div>
    </div>

    <!-- PASO 2: TRANSACCIÓN -->
    <div id="viewTxn" style="display:none;">
      <div class="step-eyebrow">Paso 2 de 2</div>
      <h1 class="step-title">Nueva transferencia</h1>

      <div class="account-card">
        <div>
          <div class="name" id="txnFullName">—</div>
          <div class="id" id="txnAccountId">—</div>
        </div>
        <span class="badge" id="txnAccountType">—</span>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="destAccount">Cuenta destino</label>
          <select id="destAccount">
            <option value="MX-9012-3344">MX-9012-3344</option>
            <option value="MX-9012-3355">MX-9012-3355</option>
            <option value="MX-9012-3366">MX-9012-3366</option>
            <option value="MX-4821-0001">MX-4821-0001</option>
            <option value="MX-4821-0002">MX-4821-0002</option>
          </select>
        </div>
        <div class="field">
          <label for="amount">Monto (MXN)</label>
          <input type="number" id="amount" placeholder="1500.00" min="1" step="0.01">
        </div>
      </div>

      <button class="btn" id="btnTxn">Enviar transferencia</button>
      <button class="btn-ghost" id="btnLogout">Cerrar sesión y volver al login</button>
      <div class="result" id="txnResult"></div>

      <div class="log-feed">
        <div class="log-feed-label">
          <span>Historial de la cuenta (servidor)</span>
          <button class="activity-refresh" id="btnRefreshActivity">Actualizar</button>
        </div>
        <div id="activityFeed"></div>
      </div>

      <div class="log-feed">
        <div class="log-feed-label">Actividad de esta sesión</div>
        <div id="logFeed"></div>
      </div>
    </div>

  </div>
</div>

<script>
  // ── Estado global ──────────────────────────────────────────────────
  let currentAccount = null;
  let fieldTouchedAt = null;   // momento del primer input real del usuario
  let viewLoadedAt   = Date.now();
  let tickInterval   = null;

  const timerDisplay = document.getElementById('timerDisplay');
  const timerHint    = document.getElementById('timerHint');
  const pulsePath     = document.getElementById('pulsePath');
  const logFeed       = document.getElementById('logFeed');
  const apiBaseInput  = document.getElementById('apiBase');
  const apiDot        = document.getElementById('apiDot');
  const apiStatusText = document.getElementById('apiStatusText');

  function apiBase(){
    return apiBaseInput.value.trim().replace(/\/$/, '');
  }

  // ── Cronómetro visual (mide el tiempo real de llenado) ───────────────
  function startTimer(){
    stopTimer();
    fieldTouchedAt = null;
    viewLoadedAt = Date.now();
    timerHint.textContent = 'Esperando interacción…';
    timerDisplay.textContent = '0.00s';
    setPulse(false);
    tickInterval = setInterval(() => {
      if (fieldTouchedAt){
        const elapsed = (Date.now() - fieldTouchedAt) / 1000;
        timerDisplay.textContent = elapsed.toFixed(2) + 's';
      }
    }, 50);
  }
  function stopTimer(){
    if (tickInterval) clearInterval(tickInterval);
    tickInterval = null;
  }
  function markFirstTouch(){
    if (!fieldTouchedAt){
      fieldTouchedAt = Date.now();
      timerHint.textContent = 'Midiendo…';
      setPulse(true);
    }
  }
  function currentUserSpeed(){
    if (!fieldTouchedAt) return 0.1;
    return Math.round(((Date.now() - fieldTouchedAt) / 1000) * 100) / 100;
  }
  function setPulse(active){
    pulsePath.setAttribute('d', active
      ? 'M0,22 L40,22 L52,8 L64,36 L76,22 L220,22'
      : 'M0,22 L220,22');
    pulsePath.style.stroke = active ? '#2FD9C4' : '#3A5A75';
  }

  // Detecta el primer input real en cualquier campo del formulario activo
  document.addEventListener('input', (e) => {
    if (e.target.matches('#username, #password, #destAccount, #amount')) {
      markFirstTouch();
    }
  });

  // ── Verificar conexión con el backend ────────────────────────────────
  async function checkApi(){
    try {
      const res = await fetch(apiBase() + '/', { method:'GET' });
      if (res.ok){
        apiDot.className = 'dot ok';
        apiStatusText.textContent = 'Backend conectado';
      } else {
        throw new Error();
      }
    } catch {
      apiDot.className = 'dot bad';
      apiStatusText.textContent = 'Sin conexión al backend';
    }
  }
  apiBaseInput.addEventListener('change', checkApi);

  // Si la página se está sirviendo desde el propio backend (vía /app/),
  // detectamos el origen automáticamente — así quien entra por el link
  // de ngrok/Tailscale no tiene que escribir ninguna URL a mano.
  if (window.location.protocol !== 'file:' && window.location.pathname.startsWith('/app')){
    apiBaseInput.value = window.location.origin;
  }
  checkApi();

  // ── Log visual de la sesión ───────────────────────────────────────────
  function pushLog(tag, text, isFail){
    const row = document.createElement('div');
    row.className = 'log-entry';
    row.innerHTML = `<span class="${isFail ? 'fail' : 'tag'}">${tag}</span><span>${text}</span>`;
    logFeed.prepend(row);
  }

  // ── PASO 1: Login ─────────────────────────────────────────────────────
  const loginResult = document.getElementById('loginResult');
  document.getElementById('btnLogin').addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const user_speed = currentUserSpeed();

    if (!username || !password){
      showResult(loginResult, 'err', 'Completa usuario y contraseña.');
      return;
    }

    try {
      const res = await fetch(apiBase() + '/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, user_speed })
      });
      const data = await res.json();

      if (res.ok){
        currentAccount = data;
        showResult(loginResult, 'ok', `Bienvenida, ${data.full_name}. Tiempo registrado: ${user_speed}s`);
        setTimeout(() => enterTransactionView(data), 500);
      } else {
        showResult(loginResult, 'err', data.detail?.message || 'Credenciales inválidas.');
      }
    } catch (err){
      showResult(loginResult, 'err', 'No se pudo contactar al backend. Verifica la URL de la VM.');
    }
  });

  function enterTransactionView(data){
    document.getElementById('viewLogin').style.display = 'none';
    document.getElementById('viewTxn').style.display = 'block';
    document.getElementById('txnFullName').textContent = data.full_name;
    document.getElementById('txnAccountId').textContent = data.account_id;
    document.getElementById('txnAccountType').textContent = data.account_type;
    logFeed.innerHTML = '';
    pushLog('LOGIN_OK', `${data.account_id} · user_speed=${currentUserSpeed()}s`);
    startTimer();
    loadAccountActivity(data.account_id);
  }

  // ── Historial de la cuenta (consulta real al servidor) ───────────────────
  const activityFeed = document.getElementById('activityFeed');

  async function loadAccountActivity(accountId){
    activityFeed.innerHTML = '<div class="activity-empty">Consultando servidor…</div>';
    try {
      const res = await fetch(apiBase() + `/api/v1/accounts/${accountId}/activity?limit=20`);
      const data = await res.json();

      if (!res.ok || !data.activity || data.activity.length === 0){
        activityFeed.innerHTML = '<div class="activity-empty">Sin actividad registrada todavía para esta cuenta.</div>';
        return;
      }

      activityFeed.innerHTML = '';
      data.activity.forEach(item => {
        const row = document.createElement('div');
        row.className = 'activity-row';
        const pillClass = item.source_type === 'human' ? 'human'
                          : item.source_type === 'simulated' ? 'simulated' : 'unknown';
        const pillLabel = item.source_type === 'human' ? 'Humano'
                          : item.source_type === 'simulated' ? 'Bot / Simulado' : '—';
        row.innerHTML = `
          <div class="activity-left">
            <span class="activity-detail">${item.detail}</span>
            <span class="activity-time">${item.timestamp}${item.user_speed !== null ? ' · ' + item.user_speed.toFixed(2) + 's' : ''}</span>
          </div>
          <span class="source-pill ${pillClass}">${pillLabel}</span>
        `;
        activityFeed.appendChild(row);
      });
    } catch (err) {
      activityFeed.innerHTML = '<div class="activity-empty">No se pudo consultar el historial del servidor.</div>';
    }
  }

  document.getElementById('btnRefreshActivity').addEventListener('click', () => {
    if (currentAccount) loadAccountActivity(currentAccount.account_id);
  });

  // ── PASO 2: Transacción ────────────────────────────────────────────────
  const txnResult = document.getElementById('txnResult');
  document.getElementById('btnTxn').addEventListener('click', async () => {
    const destination_account = document.getElementById('destAccount').value;
    const amountVal = parseFloat(document.getElementById('amount').value);
    const user_speed = currentUserSpeed();

    if (!amountVal || amountVal <= 0){
      showResult(txnResult, 'err', 'Ingresa un monto válido.');
      return;
    }

    try {
      const res = await fetch(apiBase() + '/api/v1/transactions/transfer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          account_id: currentAccount.account_id,
          destination_account,
          amount: amountVal,
          user_speed
        })
      });
      const data = await res.json();

      if (res.ok){
        showResult(txnResult, 'ok', `Transferencia procesada · ${data.transaction_id}`);
        pushLog('TXN_OK', `$${amountVal.toFixed(2)} → ${destination_account} · user_speed=${user_speed}s`);
        document.getElementById('amount').value = '';
        startTimer();
        loadAccountActivity(currentAccount.account_id);
      } else {
        showResult(txnResult, 'err', data.detail?.message || 'Transferencia rechazada.');
        pushLog('TXN_FAIL', `${destination_account} rechazada`, true);
      }
    } catch (err){
      showResult(txnResult, 'err', 'No se pudo contactar al backend.');
    }
  });

  document.getElementById('btnLogout').addEventListener('click', () => {
    currentAccount = null;
    document.getElementById('viewTxn').style.display = 'none';
    document.getElementById('viewLogin').style.display = 'block';
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    loginResult.className = 'result';
    startTimer();
  });

  function showResult(el, kind, text){
    el.className = `result show ${kind}`;
    el.textContent = text;
  }

  startTimer();
</script>

</body>
</html>
